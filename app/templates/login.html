{% extends "base.html" %}
{% block title %}Log in – {{ settings.app_name }}{% endblock %}
{% block body %}
<main class="wrap">
  <h1>Log in</h1>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="card">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required value="{{ email }}" autocomplete="email">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <p></p>
    <button class="btn block">Log in</button>
  </form>
  <p class="muted"><a href="/forgot">Forgot your password?</a> · New here? <a href="/signup">Sign up</a></p>
</main>
{% endblock %}
